<script>
const STORAGE_KEY = "pooplendar_events";

let events = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let calendar;

/* --------- FORMATEO HUMANO DEL TIEMPO --------- */
function formatElapsed(seconds) {
  const min = 60;
  const hour = 3600;
  const day = 86400;
  const week = day * 7;
  const month = day * 30;
  const year = day * 365;

  if (seconds < hour) {
    const m = Math.floor(seconds / min);
    const s = seconds % min;
    return `${m} minuto${m !== 1 ? "s" : ""} y ${s} segundo${s !== 1 ? "s" : ""}`;
  }

  if (seconds < day) {
    const h = Math.floor(seconds / hour);
    const m = Math.floor((seconds % hour) / min);
    return `${h} hora${h !== 1 ? "s" : ""} y ${m} minuto${m !== 1 ? "s" : ""}`;
  }

  if (seconds < week) {
    const d = Math.floor(seconds / day);
    const h = Math.floor((seconds % day) / hour);
    return `${d} día${d !== 1 ? "s" : ""} y ${h} hora${h !== 1 ? "s" : ""}`;
  }

  if (seconds < month) {
    const w = Math.floor(seconds / week);
    const d = Math.floor((seconds % week) / day);
    return `${w} semana${w !== 1 ? "s" : ""} y ${d} día${d !== 1 ? "s" : ""}`;
  }

  if (seconds < year) {
    const mo = Math.floor(seconds / month);
    const d = Math.floor((seconds % month) / day);
    return `${mo} mes${mo !== 1 ? "es" : ""} y ${d} día${d !== 1 ? "s" : ""}`;
  }

  const y = Math.floor(seconds / year);
  const rem = seconds % year;
  const mo = Math.floor(rem / month);
  const d = Math.floor((rem % month) / day);
  return `${y} año${y !== 1 ? "s" : ""}, ${mo} mes${mo !== 1 ? "es" : ""} y ${d} día${d !== 1 ? "s" : ""}`;
}

/* --------- ALERTAS + RECOMENDACIONES --------- */
function getAlertLevel(seconds) {
  if (seconds < 172800) return null;          // < 48h
  if (seconds < 259200) return "warning";     // 2–3 días
  if (seconds < 604800) return "alert";       // 3–7 días
  return "danger";                            // > 7 días
}

function updateStatus() {
  const counter = document.getElementById("counter");
  const alertBox = document.getElementById("alert");
  const recBox = document.getElementById("recommendations");

  if (events.length === 0) {
    counter.innerText = "Aún no hay registros";
    alertBox.style.display = "none";
    recBox.style.display = "none";
    return;
  }

  const last = new Date(Math.max(...events.map(e => new Date(e.start))));
  const diffSec = Math.floor((Date.now() - last) / 1000);

  counter.innerText = `⏱️ Última vez: ${formatElapsed(diffSec)}`;

  const level = getAlertLevel(diffSec);

  if (!level) {
    alertBox.style.display = "none";
    recBox.style.display = "none";
    return;
  }

  alertBox.style.display = "block";
  recBox.style.display = "block";

  if (level === "warning") {
    alertBox.innerText = "⚠️ Han pasado más de 2 días sin evacuar.";
    alertBox.style.background = "#d7ccc8";
    recBox.innerHTML = `
      💧 Bebe más agua<br>
      🚶 Camina 10–15 minutos
    `;
  }

  if (level === "alert") {
    alertBox.innerText = "🚨 Más de 3 días sin evacuar.";
    alertBox.style.background = "#bcaaa4";
    recBox.innerHTML = `
      💧 Aumenta líquidos<br>
      🥗 Consume fibra (frutas, avena, verduras)<br>
      🕒 Intenta ir al baño después de comer
    `;
  }

  if (level === "danger") {
    alertBox.innerText = "❗ Más de una semana sin evacuar.";
    alertBox.style.background = "#8d4b43";
    alertBox.style.color = "white";
    recBox.innerHTML = `
      ⚠️ Se recomienda consultar a un profesional de salud<br>
      🚫 Evita laxantes sin indicación médica
    `;
  }
}

/* --------- CALENDARIO --------- */
document.addEventListener("DOMContentLoaded", () => {
  calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
    initialView: "dayGridMonth",
    locale: "es",
    events: events
  });
  calendar.render();
  updateStatus();

  document.getElementById("poop-btn").onclick = () => {
    const ev = {
      id: crypto.randomUUID(),
      title: "💩",
      start: new Date().toISOString(),
      allDay: true
    };
    events.push(ev);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    calendar.addEvent(ev);
    updateStatus();
  };

  setInterval(updateStatus, 1000);
});
</script>
