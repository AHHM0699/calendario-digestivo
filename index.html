<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pooplendar 💩</title>

<!-- FullCalendar -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

<style>
:root {
  --brown-dark: #4e342e;
  --brown-main: #6d4c41;
  --brown-soft: #a1887f;
  --brown-bg: #f5f0eb;
  --brown-card: #ffffff;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  background: var(--brown-bg);
  color: var(--brown-dark);
}

h1 {
  text-align: center;
  margin: 12px 0;
  color: var(--brown-main);
}

#calendar {
  padding: 8px;
}

/* Botón 💩 flotante */
#poop-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 72px;
  height: 72px;
  font-size: 40px;
  border-radius: 50%;
  border: none;
  background: var(--brown-main);
  color: white;
  box-shadow: 0 4px 12px rgba(78,52,46,0.4);
}

/* FullCalendar */
.fc {
  background: var(--brown-card);
  border-radius: 14px;
  padding: 6px;
}

.fc-toolbar-title {
  color: var(--brown-main);
}

.fc-daygrid-day-number {
  color: var(--brown-dark);
  font-weight: 600;
}

.fc-event {
  background: transparent;
  border: none;
  text-align: center;
  font-size: 18px;
}

/* Modal */
#modal {
  position: fixed;
  inset: 0;
  background: rgba(78,52,46,0.45);
  display: none;
  align-items: center;
  justify-content: center;
}

#modal-content {
  background: var(--brown-card);
  width: 90%;
  max-height: 80%;
  border-radius: 16px;
  padding: 16px;
  overflow-y: auto;
  box-shadow: 0 6px 20px rgba(78,52,46,0.4);
}

.entry {
  border-bottom: 1px solid var(--brown-soft);
  padding: 10px 0;
}

textarea {
  width: 100%;
  margin-top: 6px;
  border-radius: 8px;
  border: 1px solid var(--brown-soft);
  padding: 6px;
  font-size: 14px;
}

button.delete {
  margin-top: 6px;
  background: none;
  border: none;
  color: var(--brown-main);
  font-size: 16px;
}
</style>
</head>

<body>

<h1>Pooplendar</h1>

<div id="calendar"></div>

<button id="poop-btn">💩</button>

<div id="modal">
  <div id="modal-content"></div>
</div>

<!-- FullCalendar JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
const STORAGE_KEY = "pooplendar_events";

function loadEvents() {
  return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
}

function saveEvents(events) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
}

let events = loadEvents();
let calendar;

document.addEventListener("DOMContentLoaded", () => {
  calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
    initialView: "dayGridMonth",
    locale: "es",
    height: "auto",
    events: events,
    dateClick(info) {
      openDay(info.dateStr);
    }
  });

  calendar.render();

  document.getElementById("poop-btn").onclick = () => {
    const now = new Date();
    const event = {
      id: crypto.randomUUID(),
      title: "💩",
      start: now.toISOString(),
      allDay: true,
      notes: ""
    };
    events.push(event);
    saveEvents(events);
    calendar.addEvent(event);
  };
});

function openDay(dateStr) {
  const modal = document.getElementById("modal");
  const box = document.getElementById("modal-content");
  box.innerHTML = `<h3>${dateStr}</h3>`;

  const dayEvents = events.filter(e => e.start.startsWith(dateStr));

  if (!dayEvents.length) {
    box.innerHTML += "<p>No hay registros.</p>";
  }

  dayEvents.forEach(e => {
    const div = document.createElement("div");
    div.className = "entry";
    div.innerHTML = `
      <strong>${new Date(e.start).toLocaleTimeString()}</strong>
      <textarea placeholder="Notas...">${e.notes || ""}</textarea>
      <button class="delete">🗑️ Eliminar</button>
    `;

    div.querySelector("textarea").onchange = ev => {
      e.notes = ev.target.value;
      saveEvents(events);
    };

    div.querySelector(".delete").onclick = () => {
      events = events.filter(x => x.id !== e.id);
      saveEvents(events);
      calendar.getEventById(e.id).remove();
      modal.style.display = "none";
    };

    box.appendChild(div);
  });

  modal.style.display = "flex";
  modal.onclick = () => modal.style.display = "none";
  box.onclick = e => e.stopPropagation();
}
</script>

</body>
</html>
