<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pooplendar 💩</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  background: #fff;
}

h1 {
  text-align: center;
  margin: 12px 0;
}

#calendar {
  padding: 8px;
}

#poop-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 72px;
  height: 72px;
  font-size: 40px;
  border-radius: 50%;
  border: none;
  background: #f5f5f5;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

#modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  display: none;
  align-items: center;
  justify-content: center;
}

#modal-content {
  background: white;
  width: 90%;
  max-height: 80%;
  border-radius: 12px;
  padding: 16px;
  overflow-y: auto;
}

.entry {
  border-bottom: 1px solid #ddd;
  padding: 8px 0;
}

textarea {
  width: 100%;
  margin-top: 6px;
}

button.delete {
  margin-top: 6px;
  background: none;
  border: none;
  color: red;
}
</style>
</head>

<body>

<h1>Pooplendar</h1>
<div id="calendar"></div>
<button id="poop-btn">💩</button>

<div id="modal">
  <div id="modal-content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
const STORAGE_KEY = "pooplendar_events";

function loadEvents() {
  return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
}

function saveEvents(events) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
}

let events = loadEvents();

document.addEventListener("DOMContentLoaded", () => {
  const calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
    initialView: "dayGridMonth",
    locale: "es",
    events: events,
    dateClick(info) {
      openDay(info.dateStr);
    }
  });

  calendar.render();

  document.getElementById("poop-btn").onclick = () => {
    const now = new Date();
    const event = {
      id: crypto.randomUUID(),
      title: "💩",
      start: now.toISOString(),
      allDay: true,
      notes: ""
    };
    events.push(event);
    saveEvents(events);
    calendar.addEvent(event);
  };
});

function openDay(dateStr) {
  const modal = document.getElementById("modal");
  const box = document.getElementById("modal-content");
  box.innerHTML = `<h3>${dateStr}</h3>`;

  const dayEvents = events.filter(e => e.start.startsWith(dateStr));

  if (!dayEvents.length) {
    box.innerHTML += "<p>No hay registros.</p>";
  }

  dayEvents.forEach(e => {
    const div = document.createElement("div");
    div.className = "entry";
    div.innerHTML = `
      <strong>${new Date(e.start).toLocaleTimeString()}</strong>
      <textarea placeholder="Notas...">${e.notes || ""}</textarea>
      <button class="delete">🗑️ Eliminar</button>
    `;

    div.querySelector("textarea").onchange = ev => {
      e.notes = ev.target.value;
      saveEvents(events);
    };

    div.querySelector(".delete").onclick = () => {
      events = events.filter(x => x.id !== e.id);
      saveEvents(events);
      location.reload();
    };

    box.appendChild(div);
  });

  modal.style.display = "flex";

  // Cerrar solo si se hace clic fuera del contenido
  modal.onclick = () => modal.style.display = "none";
  document.getElementById("modal-content").onclick = (e) => {
  e.stopPropagation();
  };
}
</script>

</body>
</html>
