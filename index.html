<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pooplendar 💩</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

<style>
:root{
  --brown-dark:#4e342e;
  --brown-main:#6d4c41;
  --brown-bg:#efe5db;
  --brown-card:#f7efe8;
  --brown-header:#e0cfc2;
  --brown-border:#c7b1a2;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--brown-bg);
  color:var(--brown-dark);
}

h1{text-align:center;margin:12px 0 4px;color:var(--brown-main);}
#counter{text-align:center;font-weight:600;margin-bottom:4px;}

#test-controls{text-align:center;margin-bottom:8px;}
#test-controls button{
  margin:2px;border:none;padding:4px 8px;
  border-radius:6px;background:#d7ccc8;
}

#alert,#recommendations{
  margin:6px 12px;padding:10px;
  border-radius:10px;display:none;
}
#recommendations{background:#efe1d6;}

#calendar{padding:8px;}

.fc{
  background:var(--brown-card);
  border-radius:16px;
  padding:6px;
}
.fc-col-header-cell{
  background:var(--brown-header);
  border:1px solid var(--brown-border);
}
.fc-daygrid-day{
  background:var(--brown-card);
  border:1px solid var(--brown-border);
}
.fc-day-today{background:#e6d2c2 !important;}
.fc-event{
  background:transparent;border:none;font-size:18px;
}

/* Botón 💩 */
#poop-btn{
  position:fixed;bottom:20px;right:20px;
  width:72px;height:72px;border-radius:50%;
  border:none;background:var(--brown-main);
  color:white;font-size:40px;z-index:1000;
}

/* MODAL */
#modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.4);
  display:none;align-items:center;justify-content:center;
  z-index:2000;
}
#modal-content{
  background:#f7efe8;
  padding:16px;
  border-radius:14px;
  width:90%;max-width:380px;
}
.day-item{
  background:#efe1d6;
  border-radius:8px;
  padding:8px;
  margin-bottom:8px;
}
.day-item textarea{
  width:100%;
  margin-top:4px;
}
</style>
</head>

<body>

<h1>Pooplendar</h1>
<div id="counter">Aún no hay registros</div>

<div id="test-controls">
  🧪 Modo prueba:
  <button onclick="setTestOffset(3600)">+1h</button>
  <button onclick="setTestOffset(172800)">+2d</button>
  <button onclick="setTestOffset(345600)">+4d</button>
  <button onclick="setTestOffset(691200)">+8d</button>
  <button onclick="clearTestOffset()">Reset</button>
</div>

<div id="alert"></div>
<div id="recommendations"></div>

<div id="calendar"></div>
<button id="poop-btn">💩</button>

<div id="modal"><div id="modal-content"></div></div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
const STORAGE_KEY = "pooplendar_events";
let calendar;
let selectedDay = null;
let testOffsetSeconds = null;

/* ---------- UTIL ---------- */
const getAllEvents = () => calendar.getEvents();

function persist(){
  const data = getAllEvents().map(e=>({
    id:e.id,
    title:e.title,
    start:e.start.toISOString(),
    notes:e.extendedProps.notes||""
  }));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

/* ---------- TIEMPO ---------- */
function formatElapsed(sec){
  const m=60,h=3600,d=86400,w=d*7,mo=d*30,y=d*365;
  if(sec<h) return `${Math.floor(sec/m)} min y ${sec%60} seg`;
  if(sec<d) return `${Math.floor(sec/h)} h y ${Math.floor((sec%h)/m)} min`;
  if(sec<w) return `${Math.floor(sec/d)} días y ${Math.floor((sec%d)/h)} h`;
  if(sec<mo) return `${Math.floor(sec/w)} sem y ${Math.floor((sec%w)/d)} días`;
  if(sec<y) return `${Math.floor(sec/mo)} mes y ${Math.floor((sec%mo)/d)} días`;
  return `${Math.floor(sec/y)} año y ${Math.floor((sec%y)/mo)} mes`;
}

/* ---------- ALERTAS ---------- */
function getAlertLevel(sec){
  if(sec<172800) return null;
  if(sec<259200) return "warning";
  if(sec<604800) return "alert";
  return "danger";
}

function updateStatus(){
  const counter=document.getElementById("counter");
  const alertBox=document.getElementById("alert");
  const recBox=document.getElementById("recommendations");

  const evs = getAllEvents();
  if(evs.length===0){
    counter.innerText="Aún no hay registros";
    alertBox.style.display="none";
    recBox.style.display="none";
    return;
  }

  const last = new Date(Math.max(...evs.map(e=>e.start)));
  const realDiff = Math.floor((Date.now()-last)/1000);
  const diff = testOffsetSeconds ?? realDiff;

  counter.innerText=`⏱️ Última vez: ${formatElapsed(diff)}`;

  const level=getAlertLevel(diff);
  if(!level){
    alertBox.style.display="none";
    recBox.style.display="none";
    return;
  }

  alertBox.style.display="block";
  recBox.style.display="block";

  if(level==="warning"){
    alertBox.innerText="⚠️ Han pasado más de 2 días sin evacuar.";
    recBox.innerHTML="💧 Bebe más agua<br>🚶 Camina";
  }
  if(level==="alert"){
    alertBox.innerText="🚨 Más de 3 días sin evacuar.";
    recBox.innerHTML="🥗 Fibra<br>💧 Líquidos";
  }
  if(level==="danger"){
    alertBox.innerText="❗ Más de una semana sin evacuar.";
    recBox.innerHTML="⚠️ Consulta a un profesional de salud";
  }
}

/* ---------- MODAL ---------- */
function openDayModal(dateStr){
  selectedDay=dateStr;
  const box=document.getElementById("modal-content");
  const list = getAllEvents()
    .filter(e=>e.start.toISOString().slice(0,10)===dateStr)
    .sort((a,b)=>a.start-b.start);

  let html=`<h3>${new Date(dateStr).toLocaleDateString()}</h3>`;

  if(list.length===0) html+=`<p>No hay registros.</p>`;

  list.forEach(ev=>{
    const t=ev.start.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    html+=`
      <div class="day-item">
        <strong>💩 ${t}</strong>
        <textarea onblur="saveNote('${ev.id}',this.value)">${ev.extendedProps.notes||""}</textarea>
        <button onclick="deleteEvent('${ev.id}')">🗑️ Eliminar</button>
      </div>
    `;
  });

  html+=`<button onclick="closeModal()">Cerrar</button>`;
  box.innerHTML=html;
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function saveNote(id,text){
  const ev = calendar.getEventById(id);
  if(ev){ ev.setExtendedProp("notes",text); persist(); }
}

function deleteEvent(id){
  const ev = calendar.getEventById(id);
  if(ev) ev.remove();
  persist();
  openDayModal(selectedDay);
}

/* ---------- MODO PRUEBA ---------- */
function setTestOffset(s){ testOffsetSeconds=s; updateStatus(); }
function clearTestOffset(){ testOffsetSeconds=null; updateStatus(); }

/* ---------- INICIO ---------- */
document.addEventListener("DOMContentLoaded",()=>{
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");

  calendar = new FullCalendar.Calendar(document.getElementById("calendar"),{
    initialView:"dayGridMonth",
    locale:"es",
    displayEventTime:false,
    events:saved,
    dateClick:(info)=>openDayModal(info.dateStr),
    eventDidMount:(info)=>{
      const day = info.event.start.toISOString().slice(0,10);
      const same = getAllEvents()
        .filter(e=>e.start.toISOString().slice(0,10)===day)
        .sort((a,b)=>a.start-b.start);

      if(info.event.id !== same[0].id){
        info.el.style.display="none";
        return;
      }
      if(same.length>1){
        info.el.innerHTML = `💩 x${same.length}`;
      }
    }
  });

  calendar.render();
  updateStatus();

  document.getElementById("poop-btn").onclick=()=>{
    calendar.addEvent({
      id:crypto.randomUUID(),
      title:"💩",
      start:new Date(),
      notes:""
    });
    persist();
    updateStatus();
  };

  setInterval(updateStatus,1000);
});
</script>

</body>
</html>
