<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pooplendar 💩</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

<style>
:root{
  --brown-dark:#4e342e;
  --brown-main:#6d4c41;
  --brown-soft:#a1887f;
  --brown-bg:#efe5db;
  --brown-card:#f7efe8;
  --brown-header:#e0cfc2;
  --brown-border:#c7b1a2;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--brown-bg);
  color:var(--brown-dark);
}

h1{
  text-align:center;
  margin:12px 0;
  color:var(--brown-main);
}

/* ---------- CALENDARIO ---------- */
#calendar{
  padding:8px;
}

.fc{
  background:var(--brown-card);
  border-radius:16px;
  padding:6px;
}

.fc-toolbar-title{
  color:var(--brown-main);
}

.fc-col-header-cell{
  background:var(--brown-header);
  color:var(--brown-dark);
  font-weight:600;
  border:1px solid var(--brown-border);
}

.fc-daygrid-day{
  background:var(--brown-card);
  border:1px solid var(--brown-border);
}

.fc-daygrid-day-number{
  color:var(--brown-dark);
  font-weight:600;
}

.fc-day-today{
  background:#e6d2c2 !important;
}

.fc-event{
  background:transparent;
  border:none;
  text-align:center;
  font-size:20px;
}

/* ---------- BOTÓN 💩 ---------- */
#poop-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  width:72px;
  height:72px;
  border-radius:50%;
  border:none;
  background:var(--brown-main);
  color:white;
  font-size:40px;
  box-shadow:0 4px 12px rgba(78,52,46,.45);
  z-index:1000; /* CLAVE */
}

/* ---------- MODAL ---------- */
#modal{
  position:fixed;
  inset:0;
  background:rgba(78,52,46,.45);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000; /* CLAVE */
}

#modal-content{
  background:var(--brown-card);
  width:90%;
  max-height:80%;
  border-radius:16px;
  padding:16px;
  overflow-y:auto;
  box-shadow:0 6px 20px rgba(78,52,46,.4);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

.modal-header h3{
  margin:0;
}

button.close{
  background:none;
  border:none;
  font-size:18px;
  color:var(--brown-main);
}

.entry{
  border-bottom:1px solid var(--brown-soft);
  padding:10px 0;
}

textarea{
  width:100%;
  margin-top:6px;
  border-radius:8px;
  border:1px solid var(--brown-soft);
  padding:6px;
  font-size:14px;
}

button.delete{
  margin-top:6px;
  background:none;
  border:none;
  color:var(--brown-main);
  font-size:16px;
}
</style>
</head>

<body>

<h1>Pooplendar</h1>

<div id="calendar"></div>

<button id="poop-btn">💩</button>

<div id="modal">
  <div id="modal-content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
const STORAGE_KEY="pooplendar_events";

function loadEvents(){
  return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
}
function saveEvents(e){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(e));
}

let events=loadEvents();
let calendar;

document.addEventListener("DOMContentLoaded",()=>{
  calendar=new FullCalendar.Calendar(document.getElementById("calendar"),{
    initialView:"dayGridMonth",
    locale:"es",
    height:"auto",
    events:events,
    dateClick(info){
      openDay(info.dateStr);
    }
  });
  calendar.render();

  document.getElementById("poop-btn").onclick=()=>{
    const now=new Date();
    const ev={
      id:crypto.randomUUID(),
      title:"💩",
      start:now.toISOString(),
      allDay:true,
      notes:""
    };
    events.push(ev);
    saveEvents(events);
    calendar.addEvent(ev);
  };
});

function openDay(dateStr){
  const modal=document.getElementById("modal");
  const box=document.getElementById("modal-content");

  box.innerHTML=`
    <div class="modal-header">
      <h3>${dateStr}</h3>
      <button class="close">Cerrar</button>
    </div>
  `;

  const dayEvents=events.filter(e=>e.start.startsWith(dateStr));
  if(!dayEvents.length){
    box.innerHTML+=`<p>No hay registros.</p>`;
  }

  dayEvents.forEach(e=>{
    const div=document.createElement("div");
    div.className="entry";
    div.innerHTML=`
      <strong>${new Date(e.start).toLocaleTimeString()}</strong>
      <textarea placeholder="Notas...">${e.notes||""}</textarea>
      <button class="delete">🗑️ Eliminar</button>
    `;

    div.querySelector("textarea").onchange=ev=>{
      e.notes=ev.target.value;
      saveEvents(events);
    };

    div.querySelector(".delete").onclick=()=>{
      events=events.filter(x=>x.id!==e.id);
      saveEvents(events);
      calendar.getEventById(e.id).remove();
      modal.style.display="none";
    };

    box.appendChild(div);
  });

  modal.style.display="flex";
  modal.onclick=()=>modal.style.display="none";
  box.onclick=e=>e.stopPropagation();
  box.querySelector(".close").onclick=()=>modal.style.display="none";
}
</script>

</body>
</html>
