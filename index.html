<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pooplendar 💩</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

<style>
:root{
  --brown-dark:#4e342e;
  --brown-main:#6d4c41;
  --brown-soft:#a1887f;
  --brown-bg:#efe5db;
  --brown-card:#f7efe8;
  --brown-header:#e0cfc2;
  --brown-border:#c7b1a2;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--brown-bg);
  color:var(--brown-dark);
}

h1{text-align:center;margin:12px 0 4px;color:var(--brown-main);}
#counter{text-align:center;font-weight:600;}
#alert,#recommendations{margin:6px 12px;padding:10px;border-radius:10px;display:none;}
#recommendations{background:#efe1d6;}

#test-controls{text-align:center;margin-bottom:8px;}
#test-controls button{
  margin:2px;border:none;padding:4px 8px;border-radius:6px;
  background:#d7ccc8;
}

#calendar{padding:8px;}

#poop-btn{
  position:fixed;bottom:20px;right:20px;
  width:72px;height:72px;border-radius:50%;
  border:none;background:var(--brown-main);
  color:white;font-size:40px;z-index:1000;
}
</style>
</head>

<body>

<h1>Pooplendar</h1>
<div id="counter">Aún no hay registros</div>

<div id="test-controls">
  🧪 Modo prueba:
  <button onclick="testBefore(172800)">+2d</button>
  <button onclick="testBefore(259200)">+3d</button>
  <button onclick="testBefore(604800)">+7d</button>
  <button onclick="clearTest()">Reset</button>
</div>

<div id="alert"></div>
<div id="recommendations"></div>

<div id="calendar"></div>
<button id="poop-btn">💩</button>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
const STORAGE_KEY="pooplendar_events";
const ALERT_SENT_KEY="pooplendar_alert_sent";

let events=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
let calendar;

/* -------- MODO PRUEBA -------- */
let testOffsetSeconds=null;

function testBefore(threshold){
  testOffsetSeconds = threshold - 10; // ⏱️ 10 segundos antes
  updateStatus();
}

function clearTest(){
  testOffsetSeconds=null;
  updateStatus();
}

/* -------- NOTIFICACIONES -------- */
function notifyOnce(level,msg){
  const sent=JSON.parse(localStorage.getItem(ALERT_SENT_KEY)||"{}");
  if(sent[level]) return;

  if(Notification.permission==="granted"){
    new Notification("Pooplendar 💩",{ body:msg });
    sent[level]=true;
    localStorage.setItem(ALERT_SENT_KEY,JSON.stringify(sent));
  }
}

/* -------- TIEMPO HUMANO -------- */
function formatElapsed(s){
  const m=60,h=3600,d=86400,w=d*7,mo=d*30,y=d*365;
  if(s<h) return `${Math.floor(s/m)} min y ${s%60} seg`;
  if(s<d) return `${Math.floor(s/h)} h y ${Math.floor((s%h)/m)} min`;
  if(s<w) return `${Math.floor(s/d)} días y ${Math.floor((s%d)/h)} h`;
  if(s<mo) return `${Math.floor(s/w)} sem y ${Math.floor((s%w)/d)} días`;
  if(s<y) return `${Math.floor(s/mo)} mes y ${Math.floor((s%mo)/d)} días`;
  return `${Math.floor(s/y)} año y ${Math.floor((s%y)/mo)} mes`;
}

/* -------- ALERTAS -------- */
function updateStatus(){
  const counter=document.getElementById("counter");
  const alertBox=document.getElementById("alert");
  const recBox=document.getElementById("recommendations");

  if(!events.length){
    counter.innerText="Aún no hay registros";
    alertBox.style.display="none";
    recBox.style.display="none";
    return;
  }

  const last=new Date(Math.max(...events.map(e=>new Date(e.start))));
  const realDiff=Math.floor((Date.now()-last)/1000);
  const diff=testOffsetSeconds!==null ? testOffsetSeconds : realDiff;

  counter.innerText=`⏱️ Última vez: ${formatElapsed(diff)}`;

  if(diff>=604800){
    alertBox.style.display="block";
    alertBox.innerText="❗ Más de una semana sin evacuar.";
    recBox.style.display="block";
    recBox.innerHTML="⚠️ Consulta a un profesional de salud.";
    notifyOnce("danger","Más de una semana sin evacuar. Consulta a un profesional.");
  } else if(diff>=259200){
    alertBox.style.display="block";
    alertBox.innerText="🚨 Más de 3 días sin evacuar.";
    recBox.style.display="block";
    recBox.innerHTML="💧 Agua · 🥗 Fibra · 🕒 Rutina";
    notifyOnce("alert","Más de 3 días sin evacuar.");
  } else if(diff>=172800){
    alertBox.style.display="block";
    alertBox.innerText="⚠️ Más de 2 días sin evacuar.";
    recBox.style.display="block";
    recBox.innerHTML="💧 Bebe más agua · 🚶 Camina";
    notifyOnce("warning","Han pasado más de 2 días sin evacuar.");
  } else {
    alertBox.style.display="none";
    recBox.style.display="none";
  }
}

/* -------- INICIO -------- */
document.addEventListener("DOMContentLoaded",()=>{
  if(Notification.permission!=="granted"){
    Notification.requestPermission();
  }

  calendar=new FullCalendar.Calendar(document.getElementById("calendar"),{
    initialView:"dayGridMonth",
    locale:"es",
    events:events
  });
  calendar.render();
  updateStatus();

  document.getElementById("poop-btn").onclick=()=>{
    const ev={id:crypto.randomUUID(),title:"💩",start:new Date().toISOString(),allDay:true};
    events.push(ev);
    localStorage.setItem(STORAGE_KEY,JSON.stringify(events));
    localStorage.removeItem(ALERT_SENT_KEY);
    calendar.addEvent(ev);
    updateStatus();
  };

  setInterval(updateStatus,1000);
});
</script>

</body>
</html>
