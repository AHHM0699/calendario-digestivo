<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pooplendar 💩</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

<style>
:root{
  --brown-dark:#4e342e;
  --brown-main:#6d4c41;
  --brown-bg:#efe5db;
  --brown-card:#f7efe8;
  --brown-header:#e0cfc2;
  --brown-border:#c7b1a2;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--brown-bg);
  color:var(--brown-dark);
}

h1{
  text-align:center;
  margin:12px 0 4px;
  color:var(--brown-main);
}

#counter{
  text-align:center;
  font-weight:600;
  margin-bottom:4px;
}

#test-controls{
  text-align:center;
  margin-bottom:8px;
}

#test-controls button{
  margin:2px;
  border:none;
  padding:4px 8px;
  border-radius:6px;
  background:#d7ccc8;
}

#alert,#recommendations{
  margin:6px 12px;
  padding:10px;
  border-radius:10px;
  display:none;
}

#recommendations{
  background:#efe1d6;
}

#calendar{
  padding:8px;
}

.fc{
  background:var(--brown-card);
  border-radius:16px;
  padding:6px;
}

.fc-col-header-cell{
  background:var(--brown-header);
  border:1px solid var(--brown-border);
}

.fc-daygrid-day{
  background:var(--brown-card);
  border:1px solid var(--brown-border);
}

.fc-day-today{
  background:#e6d2c2 !important;
}

.fc-event{
  background:transparent;
  border:none;
  font-size:20px;
}

/* Botón 💩 */
#poop-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  width:72px;
  height:72px;
  border-radius:50%;
  border:none;
  background:var(--brown-main);
  color:white;
  font-size:40px;
  z-index:1000;
}

/* Feedback 💩 */
#poop-feedback{
  position:fixed;
  bottom:110px;
  right:36px;
  font-size:28px;
  opacity:0;
  transform:scale(0.5);
  transition:all 0.25s ease;
  pointer-events:none;
}
#poop-feedback.show{
  opacity:1;
  transform:scale(1);
}
</style>
</head>

<body>

<h1>Pooplendar</h1>

<div id="counter">Aún no hay registros</div>

<div id="test-controls">
  🧪 Modo prueba:
  <button onclick="testBefore(172800)">+2d</button>
  <button onclick="testBefore(259200)">+3d</button>
  <button onclick="testBefore(604800)">+7d</button>
  <button onclick="clearTest()">Reset</button>
</div>

<div id="alert"></div>
<div id="recommendations"></div>

<div id="calendar"></div>

<button id="poop-btn">💩</button>
<div id="poop-feedback">💩</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
/* ================= CONFIG ================= */
const STORAGE_KEY = "pooplendar_events";
let events = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let calendar;
let testOffsetSeconds = null;

/* ================= FEEDBACK ================= */
function poopFeedback(){
  if(navigator.vibrate){
    navigator.vibrate(20);
  }
  const fb = document.getElementById("poop-feedback");
  fb.classList.add("show");
  setTimeout(() => fb.classList.remove("show"), 250);
}

/* ================= MODO PRUEBA ================= */
function testBefore(threshold){
  testOffsetSeconds = threshold - 10; // 10 segundos antes del cambio
  safeUpdateStatus();
}

function clearTest(){
  testOffsetSeconds = null;
  safeUpdateStatus();
}

/* ================= TIEMPO HUMANO ================= */
function formatElapsed(s){
  const m=60,h=3600,d=86400,w=d*7,mo=d*30,y=d*365;
  if(s<h) return `${Math.floor(s/m)} min y ${s%60} seg`;
  if(s<d) return `${Math.floor(s/h)} h y ${Math.floor((s%h)/m)} min`;
  if(s<w) return `${Math.floor(s/d)} días y ${Math.floor((s%d)/h)} h`;
  if(s<mo) return `${Math.floor(s/w)} sem y ${Math.floor((s%w)/d)} días`;
  if(s<y) return `${Math.floor(s/mo)} mes y ${Math.floor((s%mo)/d)} días`;
  return `${Math.floor(s/y)} año y ${Math.floor((s%y)/mo)} mes`;
}

/* ================= ESTADO (SEGURO) ================= */
function safeUpdateStatus(){
  try{
    const counter = document.getElementById("counter");
    const alertBox = document.getElementById("alert");
    const recBox = document.getElementById("recommendations");

    if(events.length === 0){
      counter.innerText = "Aún no hay registros";
      alertBox.style.display = "none";
      recBox.style.display = "none";
      return;
    }

    const valid = events.filter(e => e.start && !isNaN(new Date(e.start)));
    if(!valid.length) return;

    const last = new Date(Math.max(...valid.map(e => new Date(e.start))));
    const realDiff = Math.floor((Date.now() - last) / 1000);
    const diff = testOffsetSeconds !== null ? testOffsetSeconds : realDiff;

    counter.innerText = `⏱️ Última vez: ${formatElapsed(diff)}`;

    if(diff >= 604800){
      alertBox.style.display = "block";
      alertBox.innerText = "❗ Más de una semana sin evacuar.";
      recBox.style.display = "block";
      recBox.innerHTML = "⚠️ Consulta a un profesional de salud.";
    } else if(diff >= 259200){
      alertBox.style.display = "block";
      alertBox.innerText = "🚨 Más de 3 días sin evacuar.";
      recBox.style.display = "block";
      recBox.innerHTML = "💧 Agua · 🥗 Fibra · 🕒 Rutina";
    } else if(diff >= 172800){
      alertBox.style.display = "block";
      alertBox.innerText = "⚠️ Más de 2 días sin evacuar.";
      recBox.style.display = "block";
      recBox.innerHTML = "💧 Bebe más agua · 🚶 Camina";
    } else {
      alertBox.style.display = "none";
      recBox.style.display = "none";
    }
  } catch(e){
    /* nunca romper la app */
  }
}

/* ================= INICIO ================= */
document.addEventListener("DOMContentLoaded", () => {

  calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
    initialView: "dayGridMonth",
    locale: "es",
    events: events
  });
  calendar.render();

  document.getElementById("poop-btn").onclick = () => {
    poopFeedback();

    const ev = {
      id: Date.now().toString(),
      title: "💩",
      start: new Date().toISOString(),
      allDay: true
    };

    events.push(ev);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    calendar.addEvent(ev);
  };

  safeUpdateStatus();
  setInterval(safeUpdateStatus, 1000);
});
</script>

</body>
</html>
