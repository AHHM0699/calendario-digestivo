<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pooplendar 💩</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

<style>
:root{
  --brown-dark:#4e342e;
  --brown-main:#6d4c41;
  --brown-soft:#a1887f;
  --brown-bg:#efe5db;
  --brown-card:#f7efe8;
  --brown-header:#e0cfc2;
  --brown-border:#c7b1a2;
  --alert-soft:#d7ccc8;
  --alert-mid:#bcaaa4;
  --alert-hard:#8d4b43;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--brown-bg);
  color:var(--brown-dark);
}

h1{
  text-align:center;
  margin:12px 0 4px;
  color:var(--brown-main);
}

#counter{
  text-align:center;
  font-weight:600;
}

#alert, #recommendations{
  margin:6px 12px;
  padding:10px;
  border-radius:10px;
  display:none;
  font-weight:600;
}

#recommendations{
  background:#efe1d6;
  font-weight:500;
}

/* ---------- CALENDARIO ---------- */
#calendar{ padding:8px; }

.fc{
  background:var(--brown-card);
  border-radius:16px;
  padding:6px;
}

.fc-daygrid-day{
  background:var(--brown-card);
  border:1px solid var(--brown-border);
}

.fc-day-today{ background:#e6d2c2 !important; }

.fc-event{
  background:transparent;
  border:none;
  font-size:20px;
}

/* ---------- BOTÓN 💩 ---------- */
#poop-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  width:72px;
  height:72px;
  border-radius:50%;
  border:none;
  background:var(--brown-main);
  color:white;
  font-size:40px;
  z-index:1000;
}
</style>
</head>

<body>

<h1>Pooplendar</h1>
<div id="counter">Aún no hay registros</div>
<div id="alert"></div>
<div id="recommendations"></div>

<div id="calendar"></div>
<button id="poop-btn">💩</button>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
const STORAGE_KEY="pooplendar_events";
const ALERT_KEY="pooplendar_last_alert";

let events=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
let calendar;

function evaluateAlert(diff){
  if(diff < 172800) return null;
  if(diff < 259200) return "warning";
  if(diff < 604800) return "alert";
  return "danger";
}

function updateUI(){
  const counter=document.getElementById("counter");
  const alertBox=document.getElementById("alert");
  const recBox=document.getElementById("recommendations");

  if(!events.length){
    counter.innerText="Aún no hay registros";
    alertBox.style.display="none";
    recBox.style.display="none";
    return;
  }

  const last=new Date(Math.max(...events.map(e=>new Date(e.start))));
  const diff=Math.floor((Date.now()-last)/1000);

  counter.innerText=`⏱️ Última vez: ${Math.floor(diff/3600)} horas aprox.`;

  const level=evaluateAlert(diff);

  if(!level){
    alertBox.style.display="none";
    recBox.style.display="none";
    return;
  }

  alertBox.style.display="block";
  recBox.style.display="block";

  if(level==="warning"){
    alertBox.style.background="var(--alert-soft)";
    alertBox.innerText="⚠️ Han pasado más de 2 días sin evacuar.";
    recBox.innerHTML=`
      💧 Bebe más agua<br>
      🚶 Camina 10–15 minutos
    `;
  }

  if(level==="alert"){
    alertBox.style.background="var(--alert-mid)";
    alertBox.innerText="🚨 Más de 3 días sin evacuar.";
    recBox.innerHTML=`
      💧 Aumenta líquidos<br>
      🥗 Consume fibra (frutas, avena)<br>
      🕒 Intenta ir al baño después de comer
    `;
  }

  if(level==="danger"){
    alertBox.style.background="var(--alert-hard)";
    alertBox.style.color="white";
    alertBox.innerText="❗ Más de una semana sin evacuar.";
    recBox.innerHTML=`
      ⚠️ Se recomienda consultar a un profesional de salud<br>
      🚫 Evita laxantes sin indicación médica
    `;
  }
}

setInterval(updateUI,1000);

document.addEventListener("DOMContentLoaded",()=>{
  calendar=new FullCalendar.Calendar(document.getElementById("calendar"),{
    initialView:"dayGridMonth",
    locale:"es",
    events:events
  });
  calendar.render();
  updateUI();

  document.getElementById("poop-btn").onclick=()=>{
    const ev={ id:crypto.randomUUID(), title:"💩", start:new Date().toISOString(), allDay:true };
    events.push(ev);
    localStorage.setItem(STORAGE_KEY,JSON.stringify(events));
    updateUI();
    calendar.addEvent(ev);
  };
});
</script>

</body>
</html>
