<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pooplendar 💩</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

<style>
:root{
  --brown-dark:#4e342e;
  --brown-main:#6d4c41;
  --brown-bg:#efe5db;
  --brown-card:#f7efe8;
  --brown-header:#e0cfc2;
  --brown-border:#c7b1a2;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--brown-bg);
  color:var(--brown-dark);
}

h1{text-align:center;margin:12px 0 4px;color:var(--brown-main);}
#counter{text-align:center;font-weight:600;margin-bottom:4px;}

#test-controls{text-align:center;margin-bottom:8px;}
#test-controls button{
  margin:2px;border:none;padding:4px 8px;
  border-radius:6px;background:#d7ccc8;
}

#alert,#recommendations{
  margin:6px 12px;padding:10px;
  border-radius:10px;display:none;
}
#recommendations{background:#efe1d6;}

#calendar{padding:8px;}

.fc{
  background:var(--brown-card);
  border-radius:16px;
  padding:6px;
}
.fc-col-header-cell{
  background:var(--brown-header);
  border:1px solid var(--brown-border);
}
.fc-daygrid-day{
  background:var(--brown-card);
  border:1px solid var(--brown-border);
}
.fc-day-today{background:#e6d2c2 !important;}
.fc-event{
  background:transparent;border:none;font-size:18px;
}

/* Botón 💩 */
#poop-btn{
  position:fixed;bottom:20px;right:20px;
  width:72px;height:72px;border-radius:50%;
  border:none;background:var(--brown-main);
  color:white;font-size:40px;z-index:1000;
}

/* MODAL */
#modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.4);
  display:none;align-items:center;justify-content:center;
  z-index:2000;
}
#modal-content{
  background:#f7efe8;
  padding:16px;
  border-radius:14px;
  width:90%;max-width:380px;
}
.day-item{
  background:#efe1d6;
  border-radius:8px;
  padding:8px;
  margin-bottom:8px;
}
.day-item button{
  margin-top:4px;
}
</style>
</head>

<body>

<h1>Pooplendar</h1>

<div id="counter">Aún no hay registros</div>

<div id="test-controls">
  🧪 Modo prueba:
  <button onclick="setTestOffset(3600)">+1h</button>
  <button onclick="setTestOffset(172800)">+2d</button>
  <button onclick="setTestOffset(345600)">+4d</button>
  <button onclick="setTestOffset(691200)">+8d</button>
  <button onclick="clearTestOffset()">Reset</button>
</div>

<div id="alert"></div>
<div id="recommendations"></div>

<div id="calendar"></div>
<button id="poop-btn">💩</button>

<!-- MODAL -->
<div id="modal">
  <div id="modal-content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
/* ===== DATOS ===== */
const STORAGE_KEY="pooplendar_events";
let events=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
let calendar;
let selectedDay=null;

/* ===== MODO PRUEBA ===== */
let testOffsetSeconds=null;
function setTestOffset(sec){testOffsetSeconds=sec;updateStatus();}
function clearTestOffset(){testOffsetSeconds=null;updateStatus();}

/* ===== UTIL ===== */
function getEventsByDay(dateStr){
  return events.filter(e =>
    e.start.slice(0,10) === dateStr
  );
}

/* ===== TIEMPO HUMANO ===== */
function formatElapsed(seconds){
  const m=60,h=3600,d=86400,w=d*7,mo=d*30,y=d*365;
  if(seconds<h)return`${Math.floor(seconds/m)} min y ${seconds%60} seg`;
  if(seconds<d)return`${Math.floor(seconds/h)} h y ${Math.floor((seconds%h)/m)} min`;
  if(seconds<w)return`${Math.floor(seconds/d)} días y ${Math.floor((seconds%d)/h)} h`;
  if(seconds<mo)return`${Math.floor(seconds/w)} sem y ${Math.floor((seconds%w)/d)} días`;
  if(seconds<y)return`${Math.floor(seconds/mo)} mes y ${Math.floor((seconds%mo)/d)} días`;
  return`${Math.floor(seconds/y)} año y ${Math.floor((seconds%y)/mo)} mes`;
}

/* ===== ALERTAS ===== */
function getAlertLevel(sec){
  if(sec<172800)return null;
  if(sec<259200)return"warning";
  if(sec<604800)return"alert";
  return"danger";
}

function updateStatus(){
  const counter=document.getElementById("counter");
  const alertBox=document.getElementById("alert");
  const recBox=document.getElementById("recommendations");

  if(events.length===0){
    counter.innerText="Aún no hay registros";
    alertBox.style.display="none";
    recBox.style.display="none";
    return;
  }

  const last=new Date(Math.max(...events.map(e=>new Date(e.start))));
  const realDiff=Math.floor((Date.now()-last)/1000);
  const diff=testOffsetSeconds!==null?testOffsetSeconds:realDiff;

  counter.innerText=`⏱️ Última vez: ${formatElapsed(diff)}`;
  const level=getAlertLevel(diff);

  if(!level){
    alertBox.style.display="none";
    recBox.style.display="none";
    return;
  }

  alertBox.style.display="block";
  recBox.style.display="block";

  if(level==="warning"){
    alertBox.innerText="⚠️ Han pasado más de 2 días sin evacuar.";
    recBox.innerHTML="💧 Bebe más agua<br>🚶 Camina";
  }
  if(level==="alert"){
    alertBox.innerText="🚨 Más de 3 días sin evacuar.";
    recBox.innerHTML="🥗 Fibra<br>💧 Líquidos";
  }
  if(level==="danger"){
    alertBox.innerText="❗ Más de una semana sin evacuar.";
    recBox.innerHTML="⚠️ Consulta a un profesional de salud";
  }
}

/* ===== MODAL POR DÍA ===== */
function openDayModal(dateStr){
  selectedDay=dateStr;
  const list=getEventsByDay(dateStr);
  const modal=document.getElementById("modal");
  const box=document.getElementById("modal-content");

  let html=`<h3>${new Date(dateStr).toLocaleDateString()}</h3>`;

  if(list.length===0){
    html+=`<p>No hay registros este día.</p>`;
  }

  list.forEach(ev=>{
    const t=ev.start.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    html+=`
      <div class="day-item">
        <strong>💩 ${t}</strong><br>
        <small>${ev.extendedProps.notes||"Sin notas"}</small><br>
        <button onclick="deleteById('${ev.id}')">🗑️ Eliminar</button>
      </div>
    `;
  });

  html+=`<button onclick="closeModal()">Cerrar</button>`;
  box.innerHTML=html;
  modal.style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function deleteById(id){
  const ev=calendar.getEventById(id);
  if(ev) ev.remove();
  persistEvents();
  openDayModal(selectedDay);
}

/* ===== PERSISTENCIA ===== */
function persistEvents(){
  events=calendar.getEvents().map(e=>({
    id:e.id,
    title:e.title,
    start:e.start.toISOString(),
    allDay:false,
    notes:e.extendedProps.notes||""
  }));
  localStorage.setItem(STORAGE_KEY,JSON.stringify(events));
  updateStatus();
}

/* ===== INICIO ===== */
document.addEventListener("DOMContentLoaded",()=>{
  calendar=new FullCalendar.Calendar(document.getElementById("calendar"),{
    initialView:"dayGridMonth",
    locale:"es",
    events:events,
    displayEventTime:false,

eventDidMount:(info)=>{
  const day = info.event.start.toISOString().slice(0,10);
  const sameDayEvents = getEventsByDay(day);

  // Solo el primer evento del día se muestra
  if(info.event.id !== sameDayEvents[0].id){
    info.el.style.display = "none";
    return;
  }

  // Si hay más de uno, mostrar xN
  if(sameDayEvents.length > 1){
    info.el.innerHTML = `💩 x${sameDayEvents.length}`;
  }
},

    dateClick:(info)=>openDayModal(info.dateStr)
  });

  calendar.render();
  updateStatus();

  document.getElementById("poop-btn").onclick=()=>{
    const ev={
      id:Date.now().toString(),
      title:"💩",
      start:new Date().toISOString(),
      allDay:false,
      notes:""
    };
    calendar.addEvent(ev);
    events.push(ev);
    localStorage.setItem(STORAGE_KEY,JSON.stringify(events));
    updateStatus();
  };

  setInterval(updateStatus,1000);
});
</script>

</body>
</html>
